name: MAILTRACE CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-build-and-test:
    name: Frontend Build & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mailtrace/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: mailtrace/frontend
        run: npm ci

      - name: Run Vitest Unit Tests
        working-directory: mailtrace/frontend
        run: npm test

      - name: Run Production TypeScript Build
        working-directory: mailtrace/frontend
        run: npm run build

  backend-verification:
    name: Backend Code & Syntax Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r mailtrace/backend/requirements.txt pytest

      - name: Run Backend Pytest Suite
        working-directory: mailtrace
        run: |
          pytest -v -k "not live_external"
